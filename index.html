<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Phiếu chốt giá - Xuất DOCX</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:24px;max-width:980px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{font-size:13px;opacity:.85}
    input{width:100%;padding:10px;border:1px solid #ddd;border-radius:12px}
    .card{border:1px solid #eee;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.04);margin:12px 0}
    button{padding:12px 14px;border:0;border-radius:12px;cursor:pointer;font-weight:700;background:#111;color:#fff}
    .hint{font-size:13px;opacity:.75}
    .full{grid-column:1/-1}
  </style>
</head>
<body>
  <h1>Xuất file DOCX giữ y hệt layout</h1>
  <p class="hint">App dùng <b>template.docx</b> (file gốc đã gắn tag {{...}}) để render ra DOCX mới.</p>

  <div class="card">
    <div class="grid">
      <div><label>Ngày</label><input id="NGAY" placeholder="vd: 29/12/2025"></div>
      <div><label>Ngày trả hàng</label><input id="NGAY_TRA_HANG" placeholder="vd: 05/01/2026"></div>

      <div><label>Họ và tên</label><input id="HO_TEN"></div>
      <div><label>SĐT</label><input id="SDT"></div>

      <div><label>CCCD/Hộ chiếu</label><input id="CCCD"></div>
      <div><label>Ngày cấp</label><input id="NGAY_CAP"></div>

      <div><label>Nơi cấp</label><input id="NOI_CAP"></div>
      <div><label>Địa chỉ thường trú</label><input id="DIA_CHI"></div>

      <div class="full"><label>Thành tiền (bằng chữ)</label><input id="TIEN_BANG_CHU"></div>
    </div>
  </div>

  <div class="card">
    <p class="hint"><b>Bảng hàng</b> (1L / 5L / 1KG)</p>
    <div class="grid">
      <div class="full"><b>1L</b></div>
      <div><label>SL</label><input id="1L_SL"></div>
      <div><label>KL/1SP</label><input id="1L_KL1"></div>
      <div><label>Tổng KL</label><input id="1L_TKL"></div>
      <div><label>Đơn giá/chỉ</label><input id="1L_DG"></div>
      <div class="full"><label>Thành tiền</label><input id="1L_TT"></div>

      <div class="full"><b>5L</b></div>
      <div><label>SL</label><input id="5L_SL"></div>
      <div><label>KL/1SP</label><input id="5L_KL1"></div>
      <div><label>Tổng KL</label><input id="5L_TKL"></div>
      <div><label>Đơn giá/chỉ</label><input id="5L_DG"></div>
      <div class="full"><label>Thành tiền</label><input id="5L_TT"></div>

      <div class="full"><b>1KG</b></div>
      <div><label>SL</label><input id="1KG_SL"></div>
      <div><label>KL/1SP</label><input id="1KG_KL1"></div>
      <div><label>Tổng KL</label><input id="1KG_TKL"></div>
      <div><label>Đơn giá/chỉ</label><input id="1KG_DG"></div>
      <div class="full"><label>Thành tiền</label><input id="1KG_TT"></div>
    </div>
  </div>

  <button id="btn">Tạo file DOCX</button>
  <p id="status" class="hint"></p>

  <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.52.0/build/docxtemplater.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
